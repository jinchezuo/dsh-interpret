name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm verify-package
      - run: node scripts/check-docs.mjs

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build Windows WASAPI helper
        shell: pwsh
        run: ./scripts/build-win-audio.ps1
      - name: Smoke-run Windows helper
        shell: pwsh
        run: |
          $exe = "assets/system-audio/win32-x64/dsh-asr-capture-system.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Windows helper failed to start" }
      - run: node --test test/standalone.test.mjs
      - run: pnpm verify-package
